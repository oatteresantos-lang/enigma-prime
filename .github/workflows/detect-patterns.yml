name: Detection Patterns Viraux ENIGMA PRIME

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  detect-patterns:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install google-api-python-client youtube-transcript-api isodate groq requests edge-tts mutagen google-auth google-auth-oauthlib

      - name: Lancer le script de détection (Brique 1)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python detect_viral_patterns.py

      - name: Lancer l'extraction de patterns (Brique 2)
        run: |
          python extract_patterns.py

      - name: Générer les scripts d'histoires (Brique 3)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python generate_scripts.py

      - name: Récupérer les clips vidéo Pexels (Brique 4)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python fetch_pexels_clips.py

      - name: Générer la voix off (Brique 5)
        run: |
          python generate_voiceover.py

      - name: Monter la vidéo finale (Brique 6)
        run: |
          python generate_video.py

      - name: Uploader sur YouTube (Brique 7)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_youtube.py

      - name: Sauvegarder les résultats comme artifacts téléchargeables
        uses: actions/upload-artifact@v4
        with:
          name: enigma-prime-data-${{ github.run_number }}
          path: |
            viral_horror_data.json
            patterns_brief.json
            scripts_generes.json
            clips_manifest.json
            clips/
          retention-days: 30
