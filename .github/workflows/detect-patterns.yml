name: Detection Patterns Viraux ENIGMA PRIME

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  detect-patterns:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install google-api-python-client youtube-transcript-api isodate

      - name: Lancer le script de détection (Brique 1)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python detect_viral_patterns.py

      - name: Lancer l'extraction de patterns (Brique 2)
        run: |
          python extract_patterns.py

      - name: Sauvegarder les résultats comme artifacts téléchargeables
        uses: actions/upload-artifact@v4
        with:
          name: enigma-prime-data-${{ github.run_number }}
          path: |
            viral_horror_data.json
            patterns_brief.json
          retention-days: 30
